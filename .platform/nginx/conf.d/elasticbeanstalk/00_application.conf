# NGINX configuration for the NGS360 MCP Server.
# Included inside the server {} block, replacing the platform default.

# The MCP endpoint. Streamable HTTP replies in SSE framing
# ("event: message" / "data: {...}") even with FASTMCP_STATELESS_HTTP=true, so
# response buffering must be off -- with nginx's default buffering the frames
# are held back and MCP clients stall waiting for a reply.
location /mcp {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;

    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Long enough for a slow tool call; SSE streams must not be cut mid-response.
    proxy_connect_timeout 60s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
}

# Everything else, including the /health liveness probe used by the load
# balancer target group.
location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}
